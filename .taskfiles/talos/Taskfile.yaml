---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  generate-config:
    desc: Generate Talos configuration
    dir: '{{.TALOS_DIR}}'
    cmds:
      - topf render -o {{.TALOS_DIR}}/output
      - topf talosconfig > {{.TALOS_DIR}}/clusterconfig/talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  generate-schematic:
    desc: Generate a Talos schematic
    cmd: |-
      curl --silent -X POST --data-binary @{{ .TALOS_DIR }}/schematic.yaml https://factory.talos.dev/schematics \
        | jq --raw-output '.id'
    preconditions:
      - test -f {{.TALOS_DIR}}/schematic.yaml
      - which curl jq

  apply-node:
    desc: Apply Talos config to a node [NODE=required, hostname or IP] [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter '^{{.HOST}}$' --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      HOST:
        sh: yq '.nodes[] | select(.host == "{{.NODE}}" or .ip == "{{.NODE}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - msg: 'No node with hostname or IP "{{.NODE}}" in topf.yaml'
        sh: test -n "$(yq '.nodes[] | select(.host == "{{.NODE}}" or .ip == "{{.NODE}}") | .host' {{.TALOS_DIR}}/topf.yaml)"
      - which topf yq

  diff-node:
    desc: Show pending Talos config changes on a node [NODE=required, hostname or IP] (exit 0 either way)
    dir: '{{.TALOS_DIR}}'
    # topf exits 2 when the dry-run finds changes; treat that as success so the
    # diff itself is the output. Any other non-zero exit still fails the task.
    cmd: topf apply --dry-run --nodes-filter '^{{.HOST}}$' || test $? -eq 2
    vars:
      HOST:
        sh: yq '.nodes[] | select(.host == "{{.NODE}}" or .ip == "{{.NODE}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - msg: 'No node with hostname or IP "{{.NODE}}" in topf.yaml'
        sh: test -n "$(yq '.nodes[] | select(.host == "{{.NODE}}" or .ip == "{{.NODE}}") | .host' {{.TALOS_DIR}}/topf.yaml)"
      - which topf yq

  upgrade-node:
    desc: Upgrade Talos on a single node to topf.yaml talosVersion [NODE=required, hostname or IP]
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade --nodes-filter '^{{.HOST}}$'
    vars:
      HOST:
        sh: yq '.nodes[] | select(.host == "{{.NODE}}" or .ip == "{{.NODE}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.KUBECONFIG}}
      - msg: 'No node with hostname or IP "{{.NODE}}" in topf.yaml'
        sh: test -n "$(yq '.nodes[] | select(.host == "{{.NODE}}" or .ip == "{{.NODE}}") | .host' {{.TALOS_DIR}}/topf.yaml)"
      - which topf kubectl yq

  upgrade-k8s:
    desc: Upgrade Kubernetes to topf.yaml kubernetesVersion (via talosctl, per topf docs)
    dir: '{{.TALOS_DIR}}'
    cmd: talosctl upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - test -f {{.KUBECONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode [FULL=false]
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --full={{.FULL}} --graceful=false
    vars:
      FULL: '{{.FULL | default "false"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  reboot-node:
    desc: Reboot Talos on a single node [NODE=required] [MODE=default]
    cmd: talosctl --nodes {{.NODE}} reboot --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "default"}}'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  shutdown-node:
    desc: Gracefully power off a single node for maintenance [NODE=required]
    prompt: This will power off {{.NODE}} until it is manually powered back on... continue?
    cmd: talosctl --nodes {{.NODE}} shutdown
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl
