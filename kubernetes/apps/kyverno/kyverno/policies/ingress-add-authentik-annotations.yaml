---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/generatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-authentik-security-policy
  annotations:
    policies.kyverno.io/title: Authentik SecurityPolicy for Envoy Gateway
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/description: >-
      This policy generates an Envoy Gateway SecurityPolicy with extAuth
      configuration for HTTPRoutes annotated with
      `authentik.home.arpa/enabled: "true"`. The SecurityPolicy forwards
      authentication to the Authentik embedded outpost.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: authentik-enabled
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'authentik.home.arpa/enabled'].orValue('') == 'true'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          metadata:
            name: authentik-((object.metadata.name))
            namespace: ((object.metadata.namespace))
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: ((object.metadata.name))
            extAuth:
              headersToExtAuth:
                - Cookie
                - X-Forwarded-Proto
              http:
                backendRefs:
                  - name: authentik-outpost
                    namespace: network
                    kind: Backend
                    group: gateway.envoyproxy.io
                    port: 9000
                path: /outpost.goauthentik.io/auth/envoy
