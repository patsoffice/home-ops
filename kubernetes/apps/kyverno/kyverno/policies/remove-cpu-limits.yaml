---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-cpu-limit
  annotations:
    policies.kyverno.io/title: Remove CPU limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy removes CPU limits from all Pods (containers and
      initContainers) unless annotated `kyverno.io/ignore: "true"`.
spec:
  # Admission-only: background scans would flag pods in webhook-excluded
  # namespaces (kube-system, kyverno) that keep their CPU limits.
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-ignored
      expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations[?'kyverno.io/ignore'].orValue('') != 'true'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(object.spec.containers))
          .filter(i, has(object.spec.containers[i].resources) &&
            has(object.spec.containers[i].resources.limits) &&
            'cpu' in object.spec.containers[i].resources.limits)
          .map(i, JSONPatch{op: "remove", path: "/spec/containers/" + string(i) + "/resources/limits/cpu"})
          +
          (has(object.spec.initContainers) ?
            lists.range(size(object.spec.initContainers))
            .filter(i, has(object.spec.initContainers[i].resources) &&
              has(object.spec.initContainers[i].resources.limits) &&
              'cpu' in object.spec.initContainers[i].resources.limits)
            .map(i, JSONPatch{op: "remove", path: "/spec/initContainers/" + string(i) + "/resources/limits/cpu"})
            : [])
