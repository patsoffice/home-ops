---
# Dashboard from the ConfigMap the kyverno chart renders (grafana.enabled),
# so it tracks the chart version.
# yaml-language-server: $schema=https://schemas.ajgon.casa/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kyverno
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS_KYVERNO
  configMapRef:
    name: kyverno-grafana-grafana
    key: kyverno-dashboard.json
