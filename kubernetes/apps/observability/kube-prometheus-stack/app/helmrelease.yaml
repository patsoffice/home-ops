---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      create: true
      rules:
        kubeApiserverBurnrate: false
      disabled:
        # Replaced by client-cert-rules below: Talos mints 10-minute admin
        # certs for its own API calls, which trip the upstream p1 quantile.
        KubeClientCertificateExpiration: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - "alertmanager.${SECRET_DOMAIN}"
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/description: "Prometheus monitoring system and time series database"
            gethomepage.dev/enabled: "true"
            gethomepage.dev/icon: prometheus
            gethomepage.dev/group: Observability
            gethomepage.dev/name: Prometheus
            gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
            gethomepage.dev/widget.type: prometheus
            gethomepage.dev/widget.url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          hostnames:
            - "prometheus.${SECRET_DOMAIN}"
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        # Loki ruler pushes recording-rule results here
        enableRemoteWriteReceiver: true
        walCompression: true
        enableFeatures:
          - memory-snapshot-on-shutdown
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        scrapeTimeout: 30s
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
        # KubeVirtNoAvailableNodesToRunVMs reads this via kube_node_labels
        - nodes=[kubevirt.io/schedulable]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
    additionalPrometheusRulesMap:
      # Talos machined authenticates on control-plane nodes with a fresh
      # 10-minute admin cert (NewTemporaryClientFromPKI) - on upgrades, and
      # whenever the Node's labels/annotations change (e.g. the KubeVirt
      # heartbeat, ~1/min). Those always land in the <=30m bucket, so alert
      # only on certs with 30m..7d (warning) or 30m..24h (critical) left. A
      # genuinely expiring cert crosses those windows days before the blind
      # spot. le is matched both ways: Prometheus 3 stores "1800.0".
      client-cert-rules:
        groups:
          - name: kubernetes-system-apiserver-client-certs
            rules:
              - alert: KubeClientCertificateExpiration
                annotations:
                  description: A client certificate used to authenticate to kube-apiserver {{ $labels.instance }} is expiring in less than 7 days (ignoring sub-30m Talos temporary certs).
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeclientcertificateexpiration
                  summary: Client certificate is about to expire.
                expr: |-
                  sum by (job, cluster, instance) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",le=~"604800|604800.0"}[5m]))
                  - sum by (job, cluster, instance) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",le=~"1800|1800.0"}[5m]))
                  > 0
                for: 5m
                labels:
                  severity: warning
              - alert: KubeClientCertificateExpiration
                annotations:
                  description: A client certificate used to authenticate to kube-apiserver {{ $labels.instance }} is expiring in less than 24 hours (ignoring sub-30m Talos temporary certs).
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeclientcertificateexpiration
                  summary: Client certificate is about to expire.
                expr: |-
                  sum by (job, cluster, instance) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",le=~"86400|86400.0"}[5m]))
                  - sum by (job, cluster, instance) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",le=~"1800|1800.0"}[5m]))
                  > 0
                for: 5m
                labels:
                  severity: critical
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
