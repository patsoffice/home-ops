---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  chart:
    spec:
      chart: vpa
      version: 5.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  # Recommendations only, for Goldilocks: nothing resizes or evicts pods.
  values:
    recommender:
      enabled: true
      # Default storage (VerticalPodAutoscalerCheckpoint objects), not the
      # Prometheus history provider: its startup query over days of
      # per-container metrics is the kind of load our 2000Mi Prometheus
      # has OOMed on. Recommendations fill in over about a week instead.
      extraArgs:
        # Chart defaults (15m / 100MB) would inflate every small app;
        # e.g. atuin runs in ~20Mi.
        pod-recommendation-min-cpu-millicores: 5
        pod-recommendation-min-memory-mb: 10
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi
    updater:
      enabled: false
    admissionController:
      enabled: false
