---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app drm-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Intel iGPU utilisation per node (Plex, tdarr-node, Ollama, ...).
    # The GPU comes through DRA with adminAccess, like every other GPU
    # consumer here, so it shares the device instead of allocating it.
    dra:
      enabled: true
      deviceClassName: gpu.intel.com
      adminAccess: true
      allocationMode: All
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        # PERFMON for the i915/xe PMU counters; the chart's default
        # SYS_RAWIO is only for /dev/cpu power readings, left disabled.
        add: ["PERFMON"]
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          matchLabels:
            grafana.internal/instance: grafana
