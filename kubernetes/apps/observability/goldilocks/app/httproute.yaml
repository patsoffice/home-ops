---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    gethomepage.dev/description: "Goldilocks shows VPA resource recommendations for every workload."
    gethomepage.dev/enabled: "true"
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/FairwindsOps/goldilocks@master/pkg/dashboard/assets/images/favicon-32x32.png
    gethomepage.dev/group: Observability
    gethomepage.dev/name: Goldilocks
spec:
  hostnames:
    - "${APP}.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: ${APP}-dashboard
          namespace: observability
          port: ${APP_PORT}
