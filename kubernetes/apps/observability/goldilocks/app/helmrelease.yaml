---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 1h
  chart:
    spec:
      chart: goldilocks
      version: 11.3.1
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # VPA runs as its own release (recommender only)
    vpa:
      enabled: false
    controller:
      # Create recommendation-only VPAs for every namespace instead of
      # labelling each one goldilocks.fairwinds.com/enabled=true
      flags:
        on-by-default: "true"
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 256Mi
    dashboard:
      replicaCount: 1
      flags:
        on-by-default: "true"
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 256Mi
