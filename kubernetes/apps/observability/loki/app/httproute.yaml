---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
spec:
  hostnames:
    - "loki.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    # Read API only. Loki has no auth, so push, delete and admin paths
    # stay cluster-internal; anything else gets a 404 from Envoy.
    - matches:
        - path:
            type: Exact
            value: /loki/api/v1/query
        - path:
            type: Exact
            value: /loki/api/v1/query_range
        - path:
            type: Exact
            value: /loki/api/v1/labels
        - path:
            type: PathPrefix
            value: /loki/api/v1/label
        - path:
            type: Exact
            value: /loki/api/v1/series
        - path:
            type: PathPrefix
            value: /loki/api/v1/index
      backendRefs:
        - name: loki-gateway
          port: 80
