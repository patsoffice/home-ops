---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: alloy
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.15.0
  url: oci://ghcr.io/home-operations/charts-mirror/alloy
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app alloy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: alloy
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    crds:
      create: true
    alloy:
      enableReporting: false
      # Syslog from the UniFi console, via the alloy-syslog LoadBalancer
      extraPorts:
        - name: syslog-udp
          port: 1514
          targetPort: 1514
          protocol: UDP
      configMap:
        content: |-
          // Discover and collect logs from Kubernetes pods
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
              separator     = "/"
              target_label  = "job"
            }

            // Drop pods with annotation alloy.grafana.com/logs.enabled=false
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_alloy_grafana_com_logs_enabled"]
              regex         = "false"
              action        = "drop"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            // Extract log level from logfmt (level=info) or JSON ("level":"info") formats
            stage.regex {
              expression = "(?i)(?:level=|\"level\":\\s*\")(?P<level>\\w+)"
            }

            stage.labels {
              values = {"level" = ""}
            }

            forward_to = [loki.write.default.receiver]
          }

          // Receive BSD-style (RFC3164) syslog from network gear
          loki.relabel "syslog" {
            forward_to = []

            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }

            // UniFi APs/switches put "<mac>,<model>-<firmware>" in the
            // TAG. Keep the model, never the firmware (new stream per
            // upgrade); only plain TAGs become app.
            rule {
              source_labels = ["__syslog_message_app_name"]
              regex         = "[0-9a-f]{12},(.+?)-[0-9][0-9.+]*"
              target_label  = "model"
            }

            rule {
              source_labels = ["__syslog_message_app_name"]
              regex         = "([^,]+)"
              target_label  = "app"
            }

            rule {
              source_labels = ["__syslog_message_severity"]
              target_label  = "level"
            }
          }

          // With the TAG taken, UniFi's real program leads the message:
          // "syswrapper[1][2]:", "mcad: mcad[1]:", ": cfgmtd[1]:",
          // "/sbin/sysmon[1]:", "kernel: ...". The UDM prefixes its own
          // hostname instead: "<host> mcad[1]:".
          loki.process "syslog" {
            stage.regex {
              expression = "^[A-Za-z0-9._-]+ (?P<program>[A-Za-z0-9_.-]+)\\[\\d+\\]"
            }

            stage.regex {
              expression = "^(?:: )?(?:[^\\s:\\[]*/)?(?P<program>[A-Za-z0-9_.-]+)(?:\\[\\d+\\])*:"
            }

            stage.labels {
              values = {app = "program"}
            }

            forward_to = [loki.write.default.receiver]
          }

          loki.source.syslog "network" {
            listener {
              address       = "0.0.0.0:1514"
              protocol      = "udp"
              syslog_format = "rfc3164"
              labels        = {job = "syslog"}
            }

            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.process.syslog.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
