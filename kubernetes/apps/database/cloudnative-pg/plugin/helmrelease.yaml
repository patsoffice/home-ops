---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plugin-barman-cloud
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  # Must run in the CNPG operator's namespace (database): the operator
  # discovers CNPG-I plugins through Services there. The chart uses
  # cert-manager for the operator<->plugin mTLS certificates.
  values:
    crds:
      create: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
