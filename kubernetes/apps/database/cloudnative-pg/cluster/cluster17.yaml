---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  primaryUpdateStrategy: unsupervised
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  storage:
    size: 32Gi
    storageClass: ceph-block
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      memory: 2048Mi
  monitoring:
    enablePodMonitor: true
  # WAL archiving and base backups via the Barman Cloud plugin (the
  # in-tree barmanObjectStore is removed in CNPG 1.32). Bucket, endpoint,
  # credentials and the 14d retention live in the "garage" ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: postgres-v2
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: cloudnative-pg-secret
  # # Note: previousCluster needs to be set to the name of the previous
  # # cluster when recovering from an existing cnpg cluster
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres-v1
  # # Note: externalClusters is needed when recovering from an existing cnpg cluster
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: garage
  #         serverName: *previousCluster
---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.10.3-standalone/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: postgres17-lb
  annotations:
    external-dns.kubernetes.io/hostname: postgres17.chezlawrence.com
    lbipam.cilium.io/ips: 192.168.5.10
spec:
  type: LoadBalancer
  ports:
    - name: postgres17
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres17
    role: primary
