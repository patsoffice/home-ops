---
# Dashboard from the ConfigMap the cloudnative-pg chart renders
# (monitoring.grafanaDashboard.create), so it tracks the chart version.
# yaml-language-server: $schema=https://schemas.ajgon.casa/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cloudnative-pg
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: cnpg-grafana-dashboard
    key: cnp.json
