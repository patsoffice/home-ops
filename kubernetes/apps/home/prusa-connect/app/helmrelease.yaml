---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prusa-connect
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      prusa-connect:
        # Recreate is the chart default and is kept: the overlay file in
        # config.d is rewritten by the API and the state claim is
        # ReadWriteOnce, so a second pod cannot attach it.
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Idempotently creates the role and database on postgres17
          # before the server starts (romm precedent).
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7.0@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
              pullPolicy: IfNotPresent
            env:
              - name: INIT_POSTGRES_HOST
                value: postgres17-rw.database.svc.cluster.local
              - name: INIT_POSTGRES_DBNAME
                value: prusa-connect
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: prusa-connect-secret
                    key: POSTGRES_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: prusa-connect-secret
                    key: POSTGRES_PASSWORD
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: prusa-connect-secret
                    key: POSTGRES_SUPER_PASS
        containers:
          app:
            image:
              repository: ghcr.io/prusa3d/prusa-connect
              # renovate: datasource=docker depName=ghcr.io/prusa3d/prusa-connect
              tag: 0.1.0-beta.1@sha256:5dbb69a3d1bb3ebad9c933e9aaec6bb59cf2e2e531b93be4919b9e13ccb7370a
            # The image CMD is ["core"]; this adds the config file to read.
            # The core reads no environment variables, so everything the
            # operator sets lives in the prusa-connect-secret config.yaml.
            args:
              - core
              - -config
              - /etc/prusa-connect/config.yaml
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port ${APP_PORT}
                  periodSeconds: 2
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/readiness
                    port: *port
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # The uid/gid the image builds, fixed rather than assigned by useradd.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Volumes arrive owned by root; this lets uid 10001 write them.
        # (No effect on the NFS mount below: the NAS export itself must
        # allow writes from uid 10001.)
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
      # Printers on the LAN dial the API listener directly (IP:port),
      # bypassing the gateway. Next free IP after .107 (netbootxyz).
      printers:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.5.108
        externalTrafficPolicy: Local
        ports:
          printers:
            port: *port
    persistence:
      # The files the core writes beside the operator's own: the resource
      # overlay the API rewrites, plus pairing files. The authorization
      # graph itself lives in postgres17 now. VolSync-covered (see ks.yaml).
      state:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config/config.d
      # Uploaded print files live on the NAS: a filesystem storage reads
      # and writes through the OS, so the mount just has to be there
      # before the server starts (upstream storage.md).
      storage:
        type: nfs
        server: nas0.internal
        path: /tank/application-storage/prusa-connect
        globalMounts:
          - path: /storage
      # Operator config from the ExternalSecret (go2rtc precedent), mounted
      # as a single file: mounting the directory would work too, but the
      # secret also carries the INIT_* keys, which must not land as files
      # next to config.yaml.
      config-file:
        type: secret
        name: prusa-connect-secret
        globalMounts:
          - path: /etc/prusa-connect/config.yaml
            subPath: config.yaml
            readOnly: true
      # Scratch for multipart uploads; the root filesystem is read-only.
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
