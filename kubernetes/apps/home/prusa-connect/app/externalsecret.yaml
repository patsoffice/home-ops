---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prusa-connect
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prusa-connect-secret
    template:
      engineVersion: v2
      data:
        # The whole server configuration. The core reads no environment
        # variables, so the Postgres DSN has to arrive in this file rather
        # than as env (go2rtc precedent). `authz.database` is intentionally
        # absent: defaults fill it, and upstream's own config test validates
        # a postgres file shaped exactly like this one.
        config.yaml: |
          persistence:
            type: "postgres"
            postgres:
              dsn: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@postgres17-rw.database.svc.cluster.local:5432/prusa-connect?sslmode=disable"
          core:
            api:
              # The one listener. Printers dial it too via the
              # LoadBalancer service.
              addr: ":8080"
            log:
              level: info
              # json, because the cluster log pipeline parses rather than reads.
              format: json
            # Set rather than derived. An unset key derives from the directory
            # holding the file, and that directory is a read-only Secret
            # mount here.
            overlay: /config/config.d/resources.json
            # The subject every request is served as while core.auth.issuer
            # is empty. Complete the setup wizard before exposing this
            # beyond the LAN.
            principal: operator
            site: local
            shutdown_timeout: 15s
          resources:
            storage:
              local:
                type: filesystem
                enabled: true
                # Required, so a volume that is not there makes the pod
                # unready and takes it out of the Service.
                required: true
                config:
                  root: /storage
        # Wiring for the postgres-init init container (romm precedent).
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: prusa-connect
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: prusa-connect
    - extract:
        key: cloudnative-pg
