---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-ddns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      cloudflare-ddns:
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: external-dns-cloudflare-secret
        containers:
          app:
            image:
              # renovate: datasource=docker depName=favonia/cloudflare-ddns
              repository: favonia/cloudflare-ddns
              tag: 1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
            env:
              DOMAINS: wg.${SECRET_DOMAIN}
              PROXIED: "false"
              TTL: "60"
              IP4_PROVIDER: cloudflare.trace
              IP6_PROVIDER: none
              UPDATE_CRON: "@every 5m"
              UPDATE_ON_START: "true"
              EMOJI: "false"
              CLOUDFLARE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: external-dns-cloudflare-secret
                    key: api-token
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
