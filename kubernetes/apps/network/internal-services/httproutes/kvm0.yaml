---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_backends.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: kvm0
spec:
  # PiKVM's nginx advertises h2 via ALPN, and Envoy's default auto-negotiation
  # picks it. nginx does not support WebSockets over HTTP/2, so the /api/ws
  # upgrade is rejected with 400. wss pins the upstream to HTTP/1.1.
  appProtocols:
    - gateway.envoyproxy.io/wss
  endpoints:
    - ip:
        address: 192.168.0.30
        port: 443
  tls:
    insecureSkipVerify: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kvm0
spec:
  hostnames:
    - "kvm0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: kvm0
