---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blocky-filtered
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: blocky-filtered-db-app
    template:
      data:
        # Blocky query log
        DB_URI: "postgres://{{ .BLOCKY_POSTGRES_USER }}:{{ .BLOCKY_POSTGRES_PASS | urlquery }}@postgres17-rw.database.svc.cluster.local/blocky?sslmode=disable"
        # Postgres Init
        INIT_POSTGRES_DBNAME: blocky
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .BLOCKY_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .BLOCKY_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # Filtered view for IoT and Guest: ad + smart-TV tracking
        # blocked, no internal zones (no conditional forwarding,
        # no customDNS), so no internal records can leak.
        config.yaml: |
          upstreams:
            groups:
              default:
                - https://one.one.one.one/dns-query
                - https://dns.quad9.net/dns-query
          blocking:
            denylists:
              ads:
                - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
              tvs:
                - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt
            clientGroupsBlock:
              default:
                - ads
                - tvs
            loading:
              refreshPeriod: 4h
          queryLog:
            type: postgresql
            target: postgres://{{ .BLOCKY_POSTGRES_USER }}:{{ .BLOCKY_POSTGRES_PASS | urlquery }}@postgres17-rw.database.svc.cluster.local/blocky?sslmode=disable
            logRetentionDays: 30
            creationAttempts: 3
            creationCooldown: 2s
            flushInterval: 30s
          ports:
            dns: 53
            http: 4000
          log:
            level: info
          prometheus:
            enable: true
            path: /metrics
  dataFrom:
    - extract:
        key: blocky
    - extract:
        key: cloudnative-pg
