---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app netbootxyz
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      netbootxyz:
        # RWO ceph-block PVC: a surge pod on another node can't attach it.
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/netbootxyz/netbootxyz
              repository: ghcr.io/netbootxyz/netbootxyz
              tag: 0.7.6-nbxyz27@sha256:109e60b2d0090a6b34a5ac67e7ccc623991f7291ab25c37040fd2e554a14d7fe
            env:
              TZ: America/Los_Angeles
              NGINX_PORT: "80"
              WEB_APP_PORT: "3000"
              # Keep the whole transfer on :69 so replies match the LB flow;
              # by default dnsmasq answers from an ephemeral port.
              TFTPD_OPTS: --tftp-single-port
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    service:
      app:
        controller: netbootxyz
        ports:
          webui:
            port: 3000
      pxe:
        controller: netbootxyz
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.5.107
        ports:
          http:
            port: 80
          tftp:
            port: 69
            protocol: UDP
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      assets:
        type: nfs
        server: nas0.internal
        path: /tank/netboot
        globalMounts:
          - path: /assets
            readOnly: true
