---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: dns
spec:
  allowFirstLastIPs: "No"
  blocks:
    # DNS VIPs (.0.100-.0.103) plus headroom. Everything else in
    # the old /21 (DHCP .7.x, node and infra statics) is excluded.
    - cidr: "192.168.0.96/28"
  # Only the Blocky DNS services may draw from here, so an unpinned
  # LoadBalancer can never take an address DHCP hands out as DNS.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.namespace
        operator: In
        values: ["network"]
      - key: app.kubernetes.io/service
        operator: In
        values: ["blocky-dns", "blocky-filtered-dns"]
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    # Entire .5/24 is dedicated to Kubernetes LoadBalancers.
    - cidr: "192.168.5.0/24"
    # Entire .6/24 is dedicated to Kubernetes LoadBalancers.
    - cidr: "192.168.6.0/24"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Answer ARP for VIPs only on the main LAN NIC (2.5GbE, enp89s0 or
  # enp90s0 depending on the node), never on the 10G storage NIC
  # (enp2s0f0np0, VLAN 30), which shares no subnet with the VIPs.
  interfaces:
    - ^enp[0-9]+s0$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
