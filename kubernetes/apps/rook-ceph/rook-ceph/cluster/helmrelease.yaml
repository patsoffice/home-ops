---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
        osd:
          osd_recovery_max_active: "3" # quote
          osd_max_backfills: "2" # quote
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      healthCheck:
        # These three cannot clear while the CSI keys stay on `aes` (see
        # security.cephx.csi below). Rook mutes with `--sticky`, so they stay
        # muted even once fixed — flip to `policy: unmute` to re-expose them.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            # Disabled for the mgr memory leak: get_osds(), get_resource() and
            # the device fetchers each build a KubernetesResource per call,
            # leaking a watcher thread and HTTPS connection every time, so
            # polling the orchestrator walks the active mgr into its limit
            # (ceph/ceph#71754, not in 20.2.4). Rook reconciles through its
            # CRDs and does not need the module; the cost is that `ceph orch`
            # and the dashboard's orchestrator-backed views stop working.
            # Re-enable once the fix ships.
            enabled: false
      resources:
        mgr:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            # Measured ~95 MB/day over 30d on 20.2.4 with the rook module
            # still on -- ~4x the ~23 MB/day this was first tuned for, making
            # 2Gi about 3 weeks rather than the ~2 months claimed before.
            # Holding at 2Gi on the assumption that disabling rook above
            # removes most of it; re-measure before trusting the headroom.
            memory: 2Gi
        mon:
          requests:
            # Chart defaults, kept as-is so scheduling does not change.
            cpu: 1000m
            memory: 1Gi
          limits:
            # mon leaks ~55-100 MB/day on 20.2.4 while the cluster is
            # HEALTH_OK with every PG active+clean, so the chart's 2Gi default
            # OOMs each mon ~4 weeks after it starts: mon-n and mon-o both
            # died that way within 16h of each other. 4Gi is ~6 weeks, which
            # outlasts the Talos upgrade cadence that recycles them -- revisit
            # if upgrades ever get further apart than that.
            memory: 4Gi
      security:
        # CVE-2025-30156: cephx AES-CBC service tickets have no effective
        # integrity check, so their caps can be escalated undetected. Fixed by
        # rotating keys to the aes256k type added in Ceph v20.2.4 / Rook v1.20.6.
        cephx:
          # Rotates mon/mgr/osd/mds plus the admin, crash and ceph-exporter
          # keys, which restarts those daemons. keyType is left unset: Rook has
          # already set auth_preferred_cipher=aes256k, so rotation picks it up.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # Pinned to the pre-CVE type on purpose. aes256k for CSI PVCs needs
          # kernel 7.0+ on every node; Talos is on 6.18, and rotating these
          # would break every krbd and kernel-cephfs mount in the cluster.
          csi:
            keyType: aes
      network:
        provider: host
        addressRanges:
          public: ["192.168.0.0/21"]
          cluster: ["10.30.0.0/16"]
        connections:
          requireMsgr2: true
      storage:
        config:
          osdsPerDevice: "1"
        nodes:
          - name: k8s-00
            devices:
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1L21T9HCLS-00A07_S666NE0R400468"
          - name: k8s-01
            devices:
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1L21T9HCLS-00A07_S666NE0R400472"
          - name: k8s-02
            devices:
              - name: "/dev/disk/by-id/nvme-SAMSUNG_MZ1L21T9HCLS-00A07_S666NE0R400492"
          - name: "k8s-03"
            devices:
              - name: "/dev/disk/by-id/nvme-Micron_7450_MTFDKBG1T9TFR_22443D5C4DA3"
          - name: "k8s-04"
            devices:
              - name: "/dev/disk/by-id/nvme-Micron_7450_MTFDKBG1T9TFR_22443D5C4EAA"
        useAllDevices: false
        useAllNodes: false
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: ceph-filesystem
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          name: ceph-filesystem
          allowVolumeExpansion: true
          isDefault: false
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          pool: data0
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
    route:
      dashboard:
        host:
          name: "rook.${SECRET_DOMAIN}"
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
