---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # renovate: datasource=github-releases depName=kubevirt/containerized-data-importer
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.1/cdi-operator.yaml
patches:
  # Single ownership: the cdi ks is the only manager of Namespace/cdi.
  # The prune guard below keeps a deleted cdi ks from pruning the
  # namespace out from under the DataVolumes.
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cdi
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        labels:
          resource.kubernetes.io/admin-access: "true"
