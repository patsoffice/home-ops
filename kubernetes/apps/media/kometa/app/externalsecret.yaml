---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kometa-secret
    template:
      engineVersion: v2
      data:
        # Static Kometa env: overrides plex.url/plex.token in config.yml
        KOMETA_PLEX_URL: http://plex.media.svc.cluster.local:32400
        KOMETA_PLEX_TOKEN: "{{ .PLEX_DEVICE_TOKEN }}"
        # Any other KOMETA_* var is a config secret: <<TMDB_API_KEY>>
        KOMETA_TMDB_API_KEY: "{{ .TMDB_API_KEY }}"
        # <<MDBLIST_API_KEY>>: the universe default's lists come from MDBList
        KOMETA_MDBLIST_API_KEY: "{{ .MDBLIST_API_KEY }}"
  dataFrom:
    - extract:
        key: kometa
    - extract:
        key: plex
