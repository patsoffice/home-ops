---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tautulli-secret
    template:
      engineVersion: v2
      data:
        # App
        SECRET_TAUTULLI_SUBDOMAIN: "{{ .SECRET_TAUTULLI_SUBDOMAIN }}"
  dataFrom:
    - extract:
        key: tautulli
