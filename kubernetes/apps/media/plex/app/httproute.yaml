---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    gethomepage.dev/description: "Plex is a media server platform that organizes video, music, and photos from personal media libraries and streams them to smart TVs, streaming boxes and mobile devices."
    gethomepage.dev/enabled: "true"
    gethomepage.dev/icon: plex.svg
    gethomepage.dev/group: Media
    gethomepage.dev/name: Plex
    gethomepage.dev/widget.type: plex
    gethomepage.dev/widget.url: "http://plex.media.svc.cluster.local:${APP_PORT}"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
spec:
  hostnames:
    - "${APP}.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - name: app
      backendRefs: &backendRefs
        - name: ${APP}
          namespace: media
          port: ${APP_PORT}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              # Plex closes idle keep-alive connections after 20s unless this
              # is set, so Envoy owns the connection pool instead
              - name: X-Plex-Http-Pipeline
                value: infinite
    # External SRT subtitles fail behind a reverse proxy when the client's
    # Range header is forwarded; strip it for stream requests.
    # Ref: https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
    - name: subtitles
      backendRefs: *backendRefs
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Plex-Http-Pipeline
                value: infinite
            remove:
              - Range
      matches:
        - path:
            type: PathPrefix
            value: /library/streams
