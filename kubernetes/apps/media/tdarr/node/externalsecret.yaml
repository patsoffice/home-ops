---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-node
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tdarr-node-secret
    template:
      engineVersion: v2
      data:
        apiKey: "{{ .API_KEY }}"
  dataFrom:
    - extract:
        key: tdarr
