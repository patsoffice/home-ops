---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tdarr-node
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      tdarr-node:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: haveagitgat/tdarr_node
              tag: 3.10.00@sha256:36ef414f92f285dd97b9d1014f53aa6ebf7f8a1d2a73cc86e0832fd1c1e2d5bb
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: tdarr-node-secret
            env:
              - name: TZ
                value: America/Los_Angeles
              - name: PGID
                value: "8675309"
              - name: PUID
                value: "10070"
              - name: nodeID
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: serverIP
                value: tdarr.media.svc.cluster.local
              - name: serverPort
                value: 8266
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["plex", "tdarr-node"]
                  topologyKey: kubernetes.io/hostname
        replicas: 2
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values:
                      - "true"
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: tdarr-node-gpu
      # Run as the uid/gid the image used to drop to (PUID/PGID). The
      # image's init skips its chown/usermod steps when started
      # non-root. Group 0 keeps the image's /app, /temp and /home/Tdarr
      # dirs writable and opens the GPU: /dev/dri/renderD128 on these
      # nodes is root:root 0660.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10070
        runAsGroup: 8675309
        supplementalGroups: [0]
    service:
      app:
        controller: *app
        enabled: false
    persistence:
      cache:
        type: nfs
        server: nas0.internal
        path: /tank/transcode/tdarr/transcode-cache
        globalMounts:
          - path: /cache
      # s6-overlay needs a writable /run; the image's is root 0755.
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        globalMounts:
          - path: /run
      movies:
        type: nfs
        server: nas0.internal
        path: /tank/media/movies
        globalMounts:
          - path: /movies
      tv:
        type: nfs
        server: nas0.internal
        path: /tank/media/tv
        globalMounts:
          - path: /tv
