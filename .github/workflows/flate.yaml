---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Flate Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  test:
    name: Flate Test
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          cache: true

      - name: Run flate test
        run: flate test all --path ./kubernetes/flux/cluster --allow-missing-kinds Secret

  diff:
    name: Flate Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          cache: true

      - name: Run flate diff
        id: diff
        run: |
          diff=$(flate diff all --path ./kubernetes/flux/cluster --allow-missing-kinds Secret)
          {
              echo 'diff<<EOF'
              echo "${diff}"
              echo 'EOF'
          } >> "$GITHUB_OUTPUT";
          {
              echo "### Diff"
              echo '```diff'
              echo "${diff}"
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- flate-diff -->"
          DIFF_CONTENT: ${{ steps.diff.outputs.diff }}
        run: |
          DIFF_LENGTH=${#DIFF_CONTENT}
          PR_NUMBER=${{ github.event.pull_request.number }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ ${DIFF_LENGTH} -gt 60000 ]]; then
            BODY=$(printf '%s\n<details open>\n  <summary>Changes (%d chars — too large to post)</summary>\n\nDiff exceeds the GitHub comment size limit. View the [workflow run](%s) for full output.\n</details>' \
              "${MARKER}" "${DIFF_LENGTH}" "${RUN_URL}")
          else
            BODY=$(printf '%s\n<details open>\n  <summary>Changes</summary>\n\n```diff\n%s\n```\n\n</details>' \
              "${MARKER}" "${DIFF_CONTENT}")
          fi

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq --arg marker "${MARKER}" '.[] | select(.body | startswith($marker)) | .id' \
            | head -1)

          if [[ -n "${COMMENT_ID}" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="${BODY}"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}"
          fi

  flate-status:
    name: Flate Success
    needs: ["test", "diff"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
